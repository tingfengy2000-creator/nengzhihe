name: Stage review checks
on:
  push:
    branches: [main]
    tags: ['*-review-*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  operation-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install operation-planning dependencies
        run: python -m pip install -r requirements.txt -r requirements-phase2.txt
      - name: Run GPU-free room and cost contracts
        run: python -m unittest -v tests.test_project_load_adapter tests.test_aircost_handoff
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: round4/requirements.txt
      - name: Install current workbench dependencies
        run: python -m pip install -r round4/requirements.txt
      - name: Check repository files and links
        run: python tools/check_repository.py
      - name: Reproduce round3 in an isolated directory
        run: python tools/verify_round3.py
      - name: Reproduce round4 in an isolated directory
        run: python tools/verify_round4.py
      - name: Upload actual check receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-review-checks
          include-hidden-files: true
          path: |
            .review-work/latest.json
            .review-work/latest_round4.json
            .review-work/*/logs/
          retention-days: 30
