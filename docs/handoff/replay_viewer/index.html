<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>能智核｜5060固定回放</title>
  <style>
    :root{font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif;color:#17233c;background:#f4f7fb}
    body{max-width:1180px;margin:0 auto;padding:28px 20px 48px}
    header{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:22px}
    h1{font-size:28px;margin:0 0 8px} h2{font-size:19px;margin:0 0 12px} p{color:#586783;line-height:1.6;margin:5px 0}
    .badge{background:#e8f3ff;color:#145aa0;border-radius:999px;padding:8px 12px;font-size:13px;white-space:nowrap}
    .notice{background:#fff8e5;border:1px solid #f0d594;border-radius:12px;padding:13px 15px;margin:16px 0;color:#6b4c0b}
    .toolbar,.grid{display:grid;gap:14px}.toolbar{grid-template-columns:minmax(240px,360px) 1fr}.grid{grid-template-columns:repeat(4,minmax(0,1fr));margin:16px 0}
    .panel{background:#fff;border:1px solid #e0e7f1;border-radius:14px;padding:18px;box-shadow:0 8px 26px #213a5d0b;margin:14px 0}
    select{width:100%;padding:11px;border:1px solid #b9c7d9;border-radius:9px;background:#fff;font-size:15px;color:#17233c}
    .metric{background:#f7faff;border-radius:10px;padding:12px}.metric small{display:block;color:#65738a;font-size:12px}.metric strong{display:block;font-size:18px;margin-top:4px}
    .ok{color:#0c7a55}.warn{color:#a35b00}.muted{color:#6b7890;font-size:13px}
    table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:9px 8px;border-bottom:1px solid #e8edf4;text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left}th{color:#596a84;font-weight:600}
    .chart-wrap{overflow-x:auto}.chart{width:100%;min-width:720px;height:270px;background:#fbfdff;border-radius:10px;border:1px solid #e8edf4}.chart text{font-size:11px;fill:#718096}.legend{display:flex;gap:16px;margin-top:9px;color:#5c6b80;font-size:12px}.legend i{display:inline-block;width:12px;height:3px;vertical-align:middle;margin-right:4px}.load{background:#2c66d8}.pv{background:#12a277}.wind{background:#c98328}
    .small{font-size:12px}.mono{font-family:Consolas,monospace;white-space:pre-wrap;word-break:break-word;font-size:12px;color:#4b5d77;background:#f8fafc;border-radius:9px;padding:12px;max-height:220px;overflow:auto}
    .aircost-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:12px}
    @media(max-width:760px){body{padding:18px 12px}.toolbar,.grid{grid-template-columns:1fr 1fr}header{display:block}.badge{display:inline-block;margin-top:10px}.grid .metric:last-child{grid-column:span 2}}
  </style>
</head>
<body>
  <header><div><h1>能智核｜先试算，再决策</h1><p>5060前端固定回放入口：用真实5090结果检查信息层级、状态和图表。</p></div><div class="badge">只读回放 · 不运行仿真核心</div></header>
  <div class="notice">这里的输入不会触发热湿、光伏、风电、生命周期或本地模型计算。未列出的新条件显示“待计算/待5090验算”，不要把固定回放当作任意输入的实时结果。</div>
  <section class="panel toolbar"><div><label for="caseSelect"><strong>选择真实样例</strong></label><select id="caseSelect"></select></div><div><p id="sourceText" class="small"></p><p id="scopeText" class="small"></p></div></section>
  <section class="panel"><h2>空调成本接口回放</h2><p class="muted">来自5090真实请求—响应；页面只读，不重新执行热湿或生命周期计算。</p><select id="aircostSelect"></select><div class="aircost-grid" id="aircostMetrics"></div><div id="aircostTable"></div><div id="aircostBoundary" class="mono"></div></section>
  <section class="grid" id="metrics"></section>
  <section class="panel"><h2 id="caseTitle">—</h2><p id="caseDescription"></p><div id="recommendation" class="notice"></div><div id="constraints" class="mono"></div></section>
  <section class="panel"><h2>候选比较</h2><div id="candidateTable"></div></section>
  <section class="panel" id="chartPanel"><h2>同一时间轴上的真实逐时图表</h2><p class="muted">默认样例保留完整8784个小时；图表仅抽取显示点，不重新计算年度指标。</p><div class="chart-wrap"><svg id="chart" class="chart" viewBox="0 0 1000 270" role="img" aria-label="空调负荷、光伏与风电逐时曲线"></svg></div><div class="legend"><span><i class="load"></i>空调负荷</span><span><i class="pv"></i>光伏</span><span><i class="wind"></i>风电</span></div></section>
  <section class="panel"><h2>服务与证据边界</h2><div id="boundary" class="mono"></div></section>
  <script>
    const fmt=(v,d=2)=>v===undefined?'摘要未提供':v===null?'—':Number(v).toLocaleString('zh-CN',{maximumFractionDigits:d});
    const pct=v=>v===null||v===undefined?'不适用':`${fmt(Number(v)*100,1)}%`;
    const money=v=>v===null||v===undefined?'待报价':`${fmt(v,2)} 元`;
    const labelStatus=c=>({eligible:'可行且计价完整',excluded:'已排除',unknown:'未决：缺少必要条件',equivalent:'等价候选'})[c.admission_status]||c.admission_status||'—';
    const $=id=>document.getElementById(id); let data;
    function drawChart(chart){const svg=$('chart'); svg.innerHTML=''; if(!chart){$('chartPanel').hidden=true;return} $('chartPanel').hidden=false; const n=chart.timestamps.length, step=Math.max(1,Math.ceil(n/500)), rows=[['load_kwh','#2c66d8'],['pv_generation_kwh','#12a277'],['wind_generation_kwh','#c98328']], W=1000,H=270,pad=38; const values=rows.flatMap(([k])=>chart[k].filter(Number.isFinite)); const max=Math.max(0.01,...values); const x=i=>pad+(W-pad*2)*(i/(Math.max(1,Math.ceil(n/step)-1))), y=v=>H-pad-(H-pad*2)*v/max; rows.forEach(([key,color])=>{const points=[];for(let i=0,j=0;i<n;i+=step,j++)points.push(`${x(j)},${y(chart[key][i])}`); const p=document.createElementNS('http://www.w3.org/2000/svg','polyline');p.setAttribute('points',points.join(' '));p.setAttribute('fill','none');p.setAttribute('stroke',color);p.setAttribute('stroke-width','2');svg.appendChild(p)});['0','25%','50%','75%','100%'].forEach((t,i)=>{const text=document.createElementNS('http://www.w3.org/2000/svg','text');text.setAttribute('x',pad+i*(W-pad*2)/4);text.setAttribute('y',H-10);text.textContent=t;svg.appendChild(text)});}
    function render(c){$('caseTitle').textContent=c.label; $('caseDescription').textContent=`${c.case_id} · ${c.source.calculation_version} · 数据来源：${c.source.source_result_file}`; $('sourceText').textContent=`源码 ${c.source.source_commit} · 结果哈希 ${c.source.source_result_sha256}`; $('scopeText').textContent=`模式：${c.source.mode} · 输入只匹配固定样例`; const rec=c.recommendation||{}; $('recommendation').innerHTML=`<strong>推荐状态：${rec.status||'—'}${rec.scenario_id?` · ${rec.scenario_id}`:''}</strong><br>${rec.reason||'—'}`; $('constraints').textContent=JSON.stringify({input:c.input,eligible:rec.eligible_scenario_ids,excluded:rec.excluded_scenario_ids,unknown:rec.unknown_scenario_ids,not_provided:c.not_provided},null,2); const list=c.candidates||[]; $('metrics').innerHTML=[['建议状态',rec.status||'—'],['当前候选',rec.scenario_id||'—'],['空调负荷',c.load_context?.electric_load_kwh!==undefined?`${fmt(c.load_context.electric_load_kwh,3)} kWh`:'摘要未提供'],['服务状态',c.load_context?.service_quality?.status||c.service_quality?.status||'—']].map(x=>`<div class="metric"><small>${x[0]}</small><strong>${x[1]}</strong></div>`).join(''); $('candidateTable').innerHTML=`<table><thead><tr><th>方案</th><th>发电 kWh</th><th>购电 kWh</th><th>自用 kWh</th><th>初始投入</th><th>总成本现值</th><th>相对S0增量现值</th><th>状态</th></tr></thead><tbody>${list.map(x=>`<tr><td>${x.scenario_id}</td><td>${fmt(x.generation_kwh,3)}</td><td>${fmt(x.grid_import_kwh,3)}</td><td>${fmt(x.self_use_kwh,3)}</td><td>${money(x.capex_cny)}</td><td>${money(x.total_cost_npv_cny)}</td><td>${money(x.incremental_npv_vs_s0_cny)}</td><td>${labelStatus(x)}</td></tr>`).join('')}</tbody></table>`; const sq=c.load_context?.service_quality||c.service_quality; $('boundary').textContent=JSON.stringify({service_quality:sq,weather:c.weather,display_contract:data.display_contract},null,2); drawChart(c.chart)}
    function renderAirCost(c){const r=c.response||{}, l=r.cost?.lifecycle||{}, s=r.summary||{}, room=r.room||{}; $('aircostMetrics').innerHTML=[['房间/台数',`${room.room_count??'—'} / ${room.units_per_room??'—'}`],['单房间电量',`${fmt(s.electric_kwh,3)} kWh`],['初始费用',money(l.initial_cny)],['寿命更换',l.replacement_events?.length?l.replacement_events.map(x=>`第${x.year}年`).join('、'):'研究期内无']].map(x=>`<div class="metric"><small>${x[0]}</small><strong>${x[1]}</strong></div>`).join(''); $('aircostTable').innerHTML=`<table><thead><tr><th>月</th><th>电量 kWh</th><th>费用 元</th><th>小时</th></tr></thead><tbody>${Object.entries(r.cost?.monthly||{}).map(([m,v])=>`<tr><td>${m}</td><td>${fmt(v.electric_kwh,3)}</td><td>${money(v.cost_cny)}</td><td>${fmt(v.hours,1)}</td></tr>`).join('')}</tbody></table>`; $('aircostBoundary').textContent=JSON.stringify({case_id:c.request?.room,quote_scope:l.quote_scope,energy_scope:l.energy_scope,price:l.price_assumption_label,source_commit:data.aircost_source_commit},null,2)}
    fetch('replay_cases.json').then(r=>r.json()).then(x=>{data=x; data.cases.forEach(c=>{const o=document.createElement('option');o.value=c.case_id;o.textContent=c.label;$('caseSelect').appendChild(o)}); $('caseSelect').addEventListener('change',e=>render(data.cases.find(c=>c.case_id===e.target.value))); render(data.cases[0])}).catch(e=>{$('caseTitle').textContent='回放数据读取失败';$('caseDescription').textContent=e.message});
    fetch('aircost_cases.json').then(r=>r.json()).then(x=>{data.aircost_source_commit=x.source_commit; const entries=Object.entries(x.cases).filter(([,c])=>c.response); entries.forEach(([id,c])=>{const o=document.createElement('option');o.value=id;o.textContent=id;$('aircostSelect').appendChild(o)}); $('aircostSelect').addEventListener('change',e=>renderAirCost(x.cases[e.target.value])); if(entries.length) renderAirCost(entries[0][1])}).catch(e=>{$('aircostBoundary').textContent=`空调成本样例读取失败：${e.message}`});
  </script>
</body>
</html>
